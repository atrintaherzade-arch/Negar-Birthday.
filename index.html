<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Negar ♡</title>

<style>

/* ================================
   RESET
================================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color: #514957;

    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(255,255,255,.9),
            transparent 27%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(220,205,235,.55),
            transparent 32%
        ),
        #f4eff7;
}


/* ================================
   DECORATIONS
================================ */

.decor {
    position: fixed;

    color: #b6a6c1;

    font-size: 23px;

    opacity: .65;

    pointer-events: none;

    user-select: none;

    z-index: 0;

    animation:
        float 4s ease-in-out infinite;
}

.d1 {
    top: 9%;
    left: 8%;
}

.d2 {
    top: 17%;
    right: 9%;
    animation-delay: 1s;
}

.d3 {
    bottom: 13%;
    left: 10%;
    animation-delay: 1.7s;
}

.d4 {
    bottom: 17%;
    right: 8%;
    animation-delay: .6s;
}

.d5 {
    top: 45%;
    left: 2%;
    animation-delay: 2s;
}

.d6 {
    top: 50%;
    right: 2%;
    animation-delay: 1.3s;
}


/* ================================
   PAGE CONTAINER
================================ */

.page {
    width: 100%;

    min-height: 100vh;

    padding:
        30px 20px;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    z-index: 1;
}


/* ================================
   CARD
================================ */

.card {
    width: min(92vw, 480px);

    padding:
        48px 30px;

    text-align: center;

    background:
        rgba(255,255,255,.76);

    border:
        1px solid
        rgba(255,255,255,.92);

    border-radius: 32px;

    box-shadow:

        0 25px 70px
        rgba(75,60,85,.13),

        inset
        0 1px 0
        rgba(255,255,255,.9);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    position: relative;

    z-index: 2;

    animation:
        appear .7s ease;
}


/* ================================
   SMALL TOP TEXT
================================ */

.top {
    font-size: 14px;

    letter-spacing: 3px;

    color: #9b8da4;

    text-transform: uppercase;

    margin-bottom: 24px;
}


/* ================================
   ICON
================================ */

.icon {
    font-size: 58px;

    margin-bottom: 17px;

    animation:
        gentle 2.5s ease-in-out infinite;
}


/* ================================
   TITLE
================================ */

h1 {
    margin: 0;

    font-size:
        clamp(30px, 7vw, 43px);

    font-weight: normal;

    color: #554b5d;

    line-height: 1.35;
}


/* ================================
   DECORATIVE LINE
================================ */

.line {
    width: 70px;

    height: 1px;

    background:
        #b9a8c4;

    margin:
        25px auto;
}


/* ================================
   TEXT
================================ */

.text {
    font-size: 17px;

    line-height: 2;

    color: #706675;

    margin:
        0 auto 28px;
}


/* ================================
   BUTTON
================================ */

.main-button,
.back-button {

    display: inline-block;

    padding:
        12px 25px;

    border:
        none;

    border-radius: 15px;

    background:
        #bca9c7;

    color: white;

    font-family: inherit;

    font-size: 15px;

    cursor: pointer;

    text-decoration: none;

    box-shadow:
        0 8px 20px
        rgba(100,80,110,.12);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.main-button:hover,
.back-button:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 12px 25px
        rgba(100,80,110,.18);

    background:
        #b5a0c1;
}

.main-button:active,
.back-button:active {

    transform:
        translateY(0);
}


/* ================================
   PAGE 2
================================ */

#page2 {
    display: none;
}


/* ================================
   PAGE 2 TEXT SPACING
================================ */

.page2-text {
    font-size: 17px;

    line-height: 2;

    color: #706675;

    margin:
        0 auto 22px;
}


/* ================================
   DATE
================================ */

.birthday-date {

    display: inline-block;

    padding:
        12px 23px;

    border-radius:
        16px;

    background:
        rgba(225,214,231,.65);

    color:
        #716477;

    font-size:
        16px;

    margin:
        4px auto 27px;
}


/* ================================
   ANIMATIONS
================================ */

@keyframes float {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-9px);
    }
}


@keyframes gentle {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-5px)
            rotate(2deg);
    }
}


@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(15px)
            scale(.98);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* ================================
   MOBILE
================================ */

@media (max-width: 500px) {

    .page {

        padding:
            22px 14px;
    }

    .card {

        width:
            min(94vw, 480px);

        padding:
            43px 22px;

        border-radius:
            28px;
    }

    .decor {

        font-size:
            18px;
    }

    .top {

        font-size:
            12px;

        letter-spacing:
            2.5px;
    }

    .icon {

        font-size:
            52px;
    }

    .text,
    .page2-text {

        font-size:
            16px;
    }

    .birthday-date {

        font-size:
            15px;

        padding:
            11px 18px;
    }
}

</style>

</head>


<body>


<!-- =================================
     FLOATING DECORATIONS
================================= -->

<div class="decor d1">♡</div>

<div class="decor d2">✦</div>

<div class="decor d3">♡</div>

<div class="decor d4">✧</div>

<div class="decor d5">·</div>

<div class="decor d6">♡</div>



<!-- =================================
     PAGE 1
================================= -->

<section
    class="page"
    id="page1"
>

    <main class="card">


        <div class="top">
            A LITTLE PAGE FOR YOU
        </div>


        <div class="icon">
            ♡
        </div>


        <h1>
            Happy Birthday Negar
        </h1>


        <div class="line"></div>


        <p class="text">
            For a very special day,<br>
            made just for you
        </p>


        <button
            class="main-button"
            type="button"
            onclick="openPage2()"
        >
            open your page ♡
        </button>


    </main>

</section>



<!-- =================================
     PAGE 2
================================= -->

<section
    class="page"
    id="page2"
>

    <main class="card">


        <div class="top">
            just for you
        </div>


        <div class="icon">
            🎁
        </div>


        <h1>
            For Negar ♡
        </h1>


        <div class="line"></div>


        <p class="page2-text">
            Some days deserve a little extra sparkle.<br>
            And today is one of them. ♡
        </p>


        <p class="page2-text">
            I hope this little corner<br>
            makes your day a tiny bit more special. ♡
        </p>


        <div class="birthday-date">
            14 September · Your Day ♡
        </div>


        <br>


        <button
            class="back-button"
            type="button"
            onclick="openPage1()"
        >
            ← back
        </button>


    </main>

</section>



<script>

/* =================================
   OPEN PAGE 2
================================= */

function openPage2() {

    const page1 =
        document.getElementById("page1");

    const page2 =
        document.getElementById("page2");


    page1.style.display = "none";

    page2.style.display = "flex";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =================================
   GO BACK TO PAGE 1
================================= */

function openPage1() {

    const page1 =
        document.getElementById("page1");

    const page2 =
        document.getElementById("page2");


    page2.style.display = "none";

    page1.style.display = "flex";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

</script>


</body>

</html>
